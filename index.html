<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MK Number Tracker</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;min-height:100vh;background:#080b12;color:#fff;display:flex;justify-content:center;align-items:center;padding:20px}
.app{width:100%;max-width:600px;background:#111827;border:1px solid #273449;border-radius:20px;padding:25px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
h1{text-align:center;margin:0;font-size:30px}.subtitle{text-align:center;color:#9ca3af;margin:8px 0 25px}
input{width:100%;padding:15px;background:#080d17;color:#fff;border:1px solid #344156;border-radius:12px;font-size:18px;outline:none}
button{width:100%;border:0;padding:14px;border-radius:12px;margin-top:10px;font-size:16px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
#addBtn{background:#2563eb;color:#fff}#freezeBtn{background:#dc2626;color:#fff}#clearBtn{background:#374151;color:#fff}
.final-box{text-align:center;margin-top:25px;padding:25px;border-radius:16px;background:#080d17;border:1px solid #273449}
.label{color:#9ca3af;font-size:14px}#total{font-size:48px;font-weight:bold;margin:8px 0}
#status{display:inline-block;padding:7px 14px;border-radius:20px;background:#14532d;color:#86efac;font-size:13px}
#status.frozen{background:#7f1d1d;color:#fecaca}#updated{margin-top:10px;color:#9ca3af;font-size:13px}
.history{margin-top:25px}.history h2{font-size:19px}
.record{background:#080d17;border:1px solid #273449;border-radius:12px;padding:14px;margin-top:10px}
.record .number{font-size:20px;font-weight:bold}.record small{display:block;color:#9ca3af;margin-top:6px}
</style>
</head>
<body>
<div class="app">
<h1>🔢 MK Number Tracker</h1>
<div class="subtitle">Add numbers • Save automatically • Freeze final</div>
<input id="numberInput" type="number" step="any" placeholder="Enter number">
<button id="addBtn" onclick="addNumber()">➕ ADD NUMBER</button>
<button id="freezeBtn" onclick="freezeFinal()">🔒 FREEZE FINAL</button>
<button id="clearBtn" onclick="clearData()">🗑️ CLEAR ALL</button>

<div class="final-box">
<div class="label">FINAL TOTAL</div>
<div id="total">0</div>
<div id="status">● ACTIVE</div>
<div id="updated">No data yet</div>
</div>

<div class="history">
<h2>📋 Number History</h2>
<div id="historyList">No numbers added yet.</div>
</div>
</div>

<script>
const STORAGE_KEY="MK_NUMBER_TRACKER";

let data=JSON.parse(localStorage.getItem(STORAGE_KEY))||{
  total:0,frozen:false,lastUpdated:null,history:[]
};

function getCurrentDateTime(){
  return new Date().toLocaleString("en-IN",{
    day:"2-digit",month:"2-digit",year:"numeric",
    hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:true
  });
}

function save(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
}

function addNumber(){
  if(data.frozen){
    alert("🔒 Final total is already frozen!");
    return;
  }

  const input=document.getElementById("numberInput");
  const value=Number(input.value);

  if(input.value.trim()===""||isNaN(value)){
    alert("Please enter a valid number.");
    return;
  }

  data.total=Math.round((data.total+value)*100000000)/100000000;
  data.lastUpdated=getCurrentDateTime();

  data.history.unshift({
    number:value,
    totalAfterAdding:data.total,
    dateTime:data.lastUpdated
  });

  save();
  input.value="";
  updateUI();
}

function freezeFinal(){
  if(data.history.length===0){
    alert("Add a number before freezing.");
    return;
  }

  if(data.frozen){
    alert("🔒 Already frozen!");
    return;
  }

  if(!confirm("Freeze this final total?\n\nFINAL TOTAL: "+data.total)){
    return;
  }

  data.frozen=true;
  data.lastUpdated=getCurrentDateTime();
  save();
  updateUI();

  alert("🔒 FINAL TOTAL FROZEN!\n\n"+data.total);
}

function clearData(){
  if(!confirm("Delete all saved data and reset the total?")){
    return;
  }

  data={
    total:0,
    frozen:false,
    lastUpdated:null,
    history:[]
  };

  localStorage.removeItem(STORAGE_KEY);
  updateUI();
}

function updateUI(){
  document.getElementById("total").textContent=data.total;
  document.getElementById("updated").textContent=
    data.lastUpdated ? "Last updated: "+data.lastUpdated : "No data yet";

  const status=document.getElementById("status");
  const addBtn=document.getElementById("addBtn");
  const freezeBtn=document.getElementById("freezeBtn");

  if(data.frozen){
    status.textContent="🔒 FROZEN";
    status.classList.add("frozen");
    addBtn.disabled=true;
    freezeBtn.disabled=true;
  }else{
    status.textContent="● ACTIVE";
    status.classList.remove("frozen");
    addBtn.disabled=false;
    freezeBtn.disabled=false;
  }

  const list=document.getElementById("historyList");

  if(data.history.length===0){
    list.textContent="No numbers added yet.";
    return;
  }

  list.innerHTML=data.history.map(item=>`
    <div class="record">
      <div class="number">+ ${item.number}</div>
      <div>Total after adding: <b>${item.totalAfterAdding}</b></div>
      <small>🕒 ${item.dateTime}</small>
    </div>
  `).join("");
}

document.getElementById("numberInput").addEventListener("keydown",e=>{
  if(e.key==="Enter") addNumber();
});

updateUI();
</script>
</body>
</html>
